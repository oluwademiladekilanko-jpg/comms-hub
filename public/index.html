<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Projects &amp; Comms Hub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap">
      <h1>Digital Projects &amp; Comms Hub</h1>
      <p>Track digital projects and plan communications in one place.</p>
    </div>
  </header>

  <main id="main" class="wrap">
    <section aria-labelledby="stats-h">
      <h2 id="stats-h" class="visually-hidden">Summary</h2>
      <div id="stats" class="stats"></div>
    </section>

    <section aria-labelledby="projects-h" class="panel">
      <h2 id="projects-h">Projects</h2>

      <form id="project-form" class="form-grid" novalidate>
        <label>Title
          <input name="title" required maxlength="100" placeholder="e.g. Website accessibility refresh">
        </label>
        <label>Owner
          <input name="owner" required maxlength="60" placeholder="Who is responsible?">
        </label>
        <label>Channel
          <select name="channel"></select>
        </label>
        <label>Due date
          <input name="dueDate" type="date">
        </label>
        <label class="full">Notes
          <textarea name="notes" rows="2" maxlength="500"></textarea>
        </label>
        <div class="full actions">
          <button type="submit">Add project</button>
          <span class="form-error" role="alert" id="project-error"></span>
        </div>
      </form>

      <div class="filters" role="search">
        <label>Search <input id="project-q" type="search" placeholder="Title, owner or notes"></label>
        <label>Status <select id="project-status-filter"><option value="">All</option></select></label>
        <label>Channel <select id="project-channel-filter"><option value="">All</option></select></label>
      </div>
      <ul id="project-list" class="cards" aria-live="polite"></ul>
    </section>

    <section aria-labelledby="posts-h" class="panel">
      <h2 id="posts-h">Announcements</h2>

      <form id="post-form" class="form-grid" novalidate>
        <label>Title
          <input name="title" required maxlength="100">
        </label>
        <label>Channel
          <select name="channel"></select>
        </label>
        <label class="full">Message
          <textarea name="body" rows="3" required maxlength="1000"></textarea>
        </label>
        <label>Publish date
          <input name="publishDate" type="date">
        </label>
        <label>Status
          <select name="status"></select>
        </label>
        <div class="full actions">
          <button type="submit">Add announcement</button>
          <span class="form-error" role="alert" id="post-error"></span>
        </div>
      </form>

      <ul id="post-list" class="cards" aria-live="polite"></ul>
    </section>
  </main>

  <footer class="wrap site-footer">Comms Hub &middot; HTML, CSS, JavaScript and a Node/Express REST API</footer>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
